# 로컬 스택 (S4) — 전부 무료. AWS 계정이 필요 없다.
#
# 대체 관계 (구현설계_MVP.md §5)
#   mosquitto       ← AWS IoT Core
#   minio           ← S3            (S3 API 호환. boto3 그대로)
#   dynamodb-local  ← DynamoDB      (AWS 공식 이미지. 동일 API)
#   postgres        ← Aurora PostgreSQL
#
# 띄우기:  docker compose -f infra/docker-compose.yml up -d
# 내리기:  docker compose -f infra/docker-compose.yml down          (데이터 유지)
#          docker compose -f infra/docker-compose.yml down -v       (데이터 삭제)
#
# ⚠️ 볼륨은 named volume 을 쓴다. 바인드 마운트는 Windows 에서 권한·성능 문제가 잦다.

name: needslack-cloud

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ns-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # 발행이 성공하면 브로커가 살아 있다. mosquitto_pub 은 이미지에 들어 있다.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ns-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: needslack
      MINIO_ROOT_PASSWORD: needslack-local-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ns-dynamodb
    # inMemory 를 쓰지 않는다 — 컨테이너를 내렸다 올려도 런 결과가 남아야 한다.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports: ["8000:8000"]
    volumes:
      - dynamodb-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: ns-postgres
    environment:
      POSTGRES_USER: needslack
      POSTGRES_PASSWORD: needslack-local
      POSTGRES_DB: needslack
      # 한글 주석이 들어간 DDL 을 안전하게 받기 위해 UTF-8 을 명시한다
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needslack -d needslack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto-data:
  minio-data:
  dynamodb-data:
  pg-data:
