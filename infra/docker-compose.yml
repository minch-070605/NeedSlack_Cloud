# 로컬 스택 (S4) — 전부 무료. AWS 계정이 필요 없다.
#
# 대체 관계 (구현설계_MVP.md §5)
#   mosquitto       ← AWS IoT Core
#   minio           ← S3            (S3 API 호환. boto3 그대로)
#   dynamodb-local  ← DynamoDB      (AWS 공식 이미지. 동일 API)
#   postgres        ← Aurora PostgreSQL
#
# 띄우기:  docker compose -f infra/docker-compose.yml up -d
# 내리기:  docker compose -f infra/docker-compose.yml down          (데이터 유지)
#          docker compose -f infra/docker-compose.yml down -v       (데이터 삭제)
#
# ⚠️ 이미지는 전부 태그@다이제스트로 고정한다(CLAUDE.md §4 — 이미지도 의존성). 올릴 때는 승인받는다.
# ⚠️ 볼륨은 named volume 을 쓴다. 바인드 마운트는 Windows 에서 권한·성능 문제가 잦다.

name: needslack-cloud

services:
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408   # 2.1.2
    container_name: ns-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # 발행이 성공하면 브로커가 살아 있다. mosquitto_pub 은 이미지에 들어 있다.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub minio/minio 는 사라졌다(pull access denied). 공식 미러 quay.io 를 쓴다.
    # 커뮤니티 이미지는 2025-09-07 이후 갱신이 없다 — 로컬 S3 대체재로만 쓰므로 무방.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ns-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: needslack
      MINIO_ROOT_PASSWORD: needslack-local-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab   # 2026-07-31 빌드
    container_name: ns-dynamodb
    # inMemory 를 쓰지 않는다 — 컨테이너를 내렸다 올려도 런 결과가 남아야 한다.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports: ["8000:8000"]
    volumes:
      - dynamodb-data:/data

  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: ns-postgres
    environment:
      POSTGRES_USER: needslack
      POSTGRES_PASSWORD: needslack-local
      POSTGRES_DB: needslack
      # 한글 주석이 들어간 DDL 을 안전하게 받기 위해 UTF-8 을 명시한다
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needslack -d needslack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto-data:
  minio-data:
  dynamodb-data:
  pg-data:
