# 로컬 개발용. 익명 접속 허용 — MVP 는 로컬 스택이고 인증 경계는 M4 에서
# AWS IoT Core 의 X.509 + 토픽 정책변수로 검증한다.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
# 오프라인 영속 세션(수집기·조정기)에 보관하는 QoS 1 메시지 수. 기본 1,000 은 초과분을
# **소리 없이 버린다**(이 스택에서 1,100 발행 → 1,000 수신 실측). 두 팔 재생은 판정 메시지만
# 1,365 건(README §3 재생 실측)이라 수집기가 꺼진 채 재생하면 유실된다. 여유를 두고 올린다.
max_queued_messages 100000
